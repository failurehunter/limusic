name: Build binary

# Manual only, on purpose: no push trigger, so branches never build behind your
# back. Dispatch from Actions ▸ Build binary ▸ Run workflow.
#
# One pipeline, in order: `cargo test --all`, then the release binary, then the
# binary as an artifact. A red test stops the build, so an artifact always
# passed the suite. (checks.yml keeps its own automatic test gate on push;
# this one is the heavier release-profile check plus something to download.)
#
# Cache note: raw `actions/cache` (visible restore + save steps below) instead of
# Swatinem/rust-cache, whose post-save never lands on this fork — the entry stays frozen
# while runs succeed, so every build restores stale content. Raw caching also keeps workspace
# crates and both profiles, so yml-only pushes rebuild almost nothing. First run after this
# change is cold once.
on:
  workflow_dispatch:

permissions:
  contents: read

# A re-dispatch supersedes the previous one: cancel the stale run instead of
# queueing behind it.
concurrency:
  group: build-binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04 # same glibc 2.39 floor as the release leg
    # Cold cache pays a full test compile plus a thin-LTO release link.
    timeout-minutes: 60
    env:
      # mold instead of GNU ld: linking is the one part of a warm-cache build
      # that isn't cached. Same flag as linux-release.yml and checks.yml.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      # Actions are pinned to commit SHAs, not tags — same policy as
      # linux-release.yml. Bump pin + trailing version comment together.
      # (upload-artifact follows checks.yml's tag style: it never touches a
      # release, so it stays out of the signing-critical pin set.)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend deps
        run: cd ui && pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Tauri CLI
        # The npm CLI ships a prebuilt binary — `cargo install tauri-cli` would compile it from
        # source on every cache miss (~5 min for nothing). Same pin as linux-release.yml (see
        # the essay there); move it on purpose, with the tauri crates.
        run: npm install -g "@tauri-apps/cli@2.11.5"

      - name: Restore cargo cache
        # Separate step (not Swatinem/rust-cache): its post-save never lands here, and only a
        # visible save step fails loudly. Caches registry + git checkouts + the whole target dir,
        # both profiles and workspace crates included.
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-binary-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-binary-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-binary-${{ runner.os }}-

      # Same link-time deps as the release leg (libmpv2-sys only emits `-lmpv`,
      # so the import lib must be on disk). No linuxdeploy, no bundling.
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev libmpv-dev mold

      # Offline only, same rule as checks.yml: the live YouTube smoke test and
      # the lyrics API tests are #[ignore]d and stay out of CI. A failure here
      # stops the job before any release-profile minute is spent.
      - name: cargo test --all
        run: cargo test --all

      # `tauri build --no-bundle`, NOT `cargo build`: a plain cargo build is a dev-mode
      # binary whose webview points at devUrl (http://localhost:5183) instead of the bundled
      # frontend — tray icon, no window, "Could not connect to localhost" (see the autolaunch
      # comment in src-tauri/src/lib.rs). `--no-bundle` skips AppImage/deb packaging.
      # beforeBuildCommand is emptied because we just ran it from ui/ by hand; left on, tauri
      # runs `pnpm build` from the repo root, which resolves to the wrong package on Linux
      # (same trap as linux-release.yml documents).
      - name: Build the binary (no package)
        run: |
          set -euo pipefail
          (cd ui && pnpm build)
          tauri build --no-bundle --config '{"build":{"beforeBuildCommand":""}}'
          ls -la target/release/limusic-app

      - name: Save cargo cache
        # `always()`: even a red build leaves compiled dependencies behind for the next run.
        # The key carries the sha, so every save is a new entry — old ones age out by LRU.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-binary-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: limusic-binary
          path: target/release/limusic-app
          # A smoke-test binary, not a release: a week is plenty, and the
          # fork's artifact storage is finite.
          retention-days: 7
